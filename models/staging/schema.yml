version: 2

models:
  - name: stg_orders
    description: Cleaned and consistently typed order records.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: customer_name
        data_tests: [not_null]
      - name: customer_email
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: product_name
        data_tests: [not_null]
      - name: product_category
        data_tests: [not_null]
      - name: order_amount
        data_tests: [not_null]
      - name: order_currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [USD]
      - name: order_date
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [delivered, shipped, processing, cancelled]

